<!doctype html><html><head><meta charset=utf-8>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,500;9..40,700&display=swap">
<style>
:root{--ink:#0E0B1F;--white:#fff;--yellow:#FFE14D;--purple:#5B2EFF;--line:5px solid var(--ink)}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;overflow:hidden;background:var(--purple);color:var(--white);font-family:"DM Sans";position:relative}
.tag{position:absolute;left:84px;top:96px;background:var(--white);color:var(--ink);border:var(--line);border-radius:999px;padding:12px 30px;font:700 30px "DM Sans";letter-spacing:.06em;text-transform:uppercase}
h1{position:absolute;left:84px;right:84px;top:220px;font-family:"Bricolage Grotesque";font-weight:800;letter-spacing:-.045em;font-size:132px;line-height:.92}
.hl{background:var(--yellow);color:var(--ink);border:var(--line);border-radius:999px;padding:0 .2em;display:inline-block;transform:rotate(-2deg);box-shadow:10px 10px 0 var(--ink)}
.list{position:absolute;left:84px;right:84px;top:640px;display:flex;flex-direction:column;gap:26px}
.row{display:flex;align-items:center;gap:26px;background:var(--white);color:var(--ink);border:var(--line);border-radius:30px;box-shadow:8px 8px 0 var(--ink);padding:24px 34px;font:700 40px "DM Sans"}
.box{width:52px;height:52px;border:5px solid var(--ink);border-radius:12px;flex:none}
.ln{flex:1;border-bottom:4px dashed #b9b2d6;height:30px}
.btn{position:absolute;left:84px;top:1060px;background:var(--white);color:var(--ink);border:var(--line);border-radius:999px;box-shadow:10px 10px 0 var(--ink);padding:22px 48px;font:800 50px "Bricolage Grotesque";letter-spacing:-.03em}
.foot{position:absolute;left:84px;right:84px;bottom:76px;display:flex;justify-content:space-between;align-items:center}
.lock{display:flex;align-items:center;gap:14px;font:800 44px "Bricolage Grotesque";letter-spacing:-.04em}
.lock img{width:62px}
.sw{font:500 30px "DM Sans";color:rgba(255,255,255,.85)}
</style></head><body>
<span class="tag">Free offer</span>
<h1>Let the <span class="hl">busywork</span> run itself.</h1>
<div class="list"><div class="row"><span class="box"></span>Task 1<span class="ln"></span></div><div class="row"><span class="box"></span>Task 2<span class="ln"></span></div><div class="row"><span class="box"></span>Task 3<span class="ln"></span></div></div>
<div class="btn">Bring 3 tasks ↗</div>
<div class="foot"><div class="lock"><img src="monogram-white.png">amatchless.</div><div class="sw">Free 30-min call</div></div>
</body></html>
