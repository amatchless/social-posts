<!doctype html><html><head><meta charset=utf-8>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,500;9..40,700&display=swap">
<style>
:root{--ink:#0E0B1F;--white:#fff;--yellow:#FFE14D;--pink:#FF4F9A;--line:5px solid var(--ink)}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;overflow:hidden;background:var(--pink);color:var(--ink);font-family:"DM Sans";position:relative}
.tag{position:absolute;left:84px;top:96px;background:var(--white);border:var(--line);border-radius:999px;padding:12px 30px;font:700 30px "DM Sans";letter-spacing:.06em;text-transform:uppercase}
.p{position:absolute;left:84px;right:84px;background:var(--white);border:var(--line);border-radius:52px;box-shadow:14px 14px 0 var(--ink);padding:64px 68px}
.p b{display:block;font:700 30px "DM Sans";letter-spacing:.08em;text-transform:uppercase;margin-bottom:22px}
.p div{font-family:"Bricolage Grotesque";font-weight:800;letter-spacing:-.04em;font-size:88px;line-height:.95}
.p1{top:230px}
.p2{top:740px;background:var(--yellow);transform:rotate(-1.5deg)}
.foot{position:absolute;left:84px;right:84px;bottom:76px;display:flex;justify-content:space-between;align-items:center}
.lock{display:flex;align-items:center;gap:14px;font:800 44px "Bricolage Grotesque";letter-spacing:-.04em}
.lock img{width:62px}
.chip{background:var(--white);border:var(--line);border-radius:999px;padding:10px 28px;font:700 30px "DM Sans"}
</style></head><body>
<span class="tag">Swap test</span>
<div class="p p1"><b>Try this</b><div>Put a competitor's name on your homepage.</div></div>
<div class="p p2"><b>Still reads true?</b><div>Your message isn't distinctive yet.</div></div>
<div class="foot"><div class="lock"><img src="monogram-ink.png">amatchless.</div><span class="chip">Branding</span></div>
</body></html>
