<!doctype html><html><head><meta charset=utf-8><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,500;9..40,700&display=swap"><style>
:root{--ink:#0E0B1F;--white:#fff;--yellow:#FFE14D;--pink:#FF4F9A;--mint:#3DEBB0;--muted:#3A3550;--line:5px solid var(--ink)}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;background:var(--yellow);color:var(--ink);position:relative;overflow:hidden;font-family:"DM Sans"}
.d{font-family:"Bricolage Grotesque";font-weight:800;letter-spacing:-.04em}
.p{position:absolute;left:84px;right:84px;background:var(--white);border:var(--line);border-radius:48px;box-shadow:14px 14px 0 var(--ink);padding:54px 60px}
.lab{display:inline-block;border:var(--line);border-radius:999px;padding:8px 28px;font:700 30px "DM Sans";letter-spacing:.08em;text-transform:uppercase}
.myth{top:120px}
.myth .lab{background:#fff}
.myth h2{margin-top:34px;font-size:92px;line-height:.98;color:var(--muted)}
.st{background:linear-gradient(transparent 46%,var(--pink) 46%,var(--pink) 58%,transparent 58%)}
.fact{top:700px;transform:rotate(-1.5deg)}
.fact .lab{background:var(--mint)}
.fact h2{margin-top:34px;font-size:84px;line-height:.98}
.foot{position:absolute;left:84px;right:84px;bottom:76px;display:flex;justify-content:space-between;align-items:center}
.lock{display:flex;align-items:center;gap:14px;font:800 44px "Bricolage Grotesque";letter-spacing:-.04em}
.lock img{width:62px}
.chip{background:var(--white);border:var(--line);border-radius:999px;padding:10px 30px;font:700 30px "DM Sans";letter-spacing:.06em;text-transform:uppercase}
</style></head><body>
<div class="p myth"><span class="lab">Myth</span><h2 class="d"><span class="st">If the ads aren't working, spend more.</span></h2></div>
<div class="p fact"><span class="lab">Fact</span><h2 class="d">More budget makes a weak ad fail faster.</h2></div>
<div class="foot"><div class="lock"><img src="monogram-ink.png">amatchless.</div><div class="chip">Ads</div></div>
</body></html>
